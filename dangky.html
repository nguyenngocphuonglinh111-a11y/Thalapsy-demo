<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>thalaspsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Butterpop";
        src: url("Butterpop.ttf") format("truetype");
      }
      .navbar-brand {
        font-family: Butterpop;
        color: #586971;
        text-shadow: 1px 1px 1px rgb(215, 203, 203);
        font-size: 50px;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background: url("z8122726287510_b420f47a3c7afe0dbd71fee09bad2a02.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        font-family: sans-serif;
        flex-direction: column;
        background-attachment: fixed;
      }

      .container {
        margin-top: 67px;
      }

      .container .card {
        background: transparent;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(5px);
        border-radius: 10px;
        color: #fff;
      }

      .container input {
        background: transparent;
        color: #fff;
      }

      .container input::placeholder {
        color: #fff;
      }

      .container .bel {
        text-decoration: none;
        color: #fff;
        font-weight: bold;
      }

      .container .bel:hover {
        text-decoration: underline;
      }

      .buton {
        position: fixed;
        top: 20px;
        background-color: #829aa6;
        border: none;
        border-radius: 10px;
        padding: 5px 20px;
        left: 20px;
        margin-left: 10px;
      }

      .link {
        color: #fff;
        text-decoration: none;
        font-size: 20px;
      }

      .container .btn {
        width: 100%;
        height: 45px;
        background: #fff;
        border: none;
        outline: none;
        border-radius: 40px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        font-size: 16px;
        color: #333;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="buton"><a class="link" href="taikhoan.html">←</a></button>
      <!--Start Form đăng ký-->
      <div class="card m-2 shadow">
        <div class="card-body">
          <form id="formDangKy" class="row g-3 needs-validation" novalidate>
            <!--Start row-->
            <div class="col-12">
              <a class="navbar-brand" href="trangchu.html">
                <img
                  src=""
                  alt="Logo"
                  width="40"
                  height="40"
                  class="d-inline-block align-text-top"
                />
                thalapsy
              </a>
            </div>
            <!--End row-->

            <!--Start row-->
            <div class="col-md-6">
              <label for="validationCustom01" class="form-label"
                >Họ và tên
              </label>
              <input
                type="text"
                class="form-control"
                id="hoTen"
                placeholder="Nhập họ và tên đệm"
                required
              />
              <div class="valid-feedback">Trông thật tốt!</div>
            </div>
            <div class="col-md-6">
              <label for="validationCustom02" class="form-label"
                >Tên tài khoản</label
              >
              <input
                type="text"
                class="form-control"
                id="tenTaiKhoan"
                placeholder="Nhập tên "
                required
              />
              <div class="valid-feedback">Trông thật tốt!</div>
            </div>
            <!--End row-->

            <!--Start row-->
            <div class="col-md-6">
              <label for="validationCustomUsername" class="form-label"
                >Email</label
              >
              <div class="input-group has-validation">
                <span class="input-group-text" id="inputGroupPrepend">@</span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  aria-describedby="inputGroupPrepend"
                  placeholder="Nhập email"
                  required
                />
                <div class="invalid-feedback">Nhập email của bạn.</div>
              </div>
            </div>
            <div class="col-md-6">
              <label for="validationCustom05" class="form-label"
                >Ngày sinh</label
              >
              <input type="date" class="form-control" id="ngaySinh" />
              <div class="invalid-feedback">Please provide a valid zip.</div>
            </div>

            <!--End row-->

            <!--Start row-->
            <div class="col-md-6 mb-3">
              <label for="validationCustom05" class="form-label"
                >Mật khẩu</label
              >
              <input
                type="password"
                class="form-control"
                id="matKhau"
                placeholder="Nhập mật khẩu"
                required
              />
              <div class="invalid-feedback">Please provide a valid zip.</div>
            </div>

            <div class="col-md-6">
              <label for="validationCustom05" class="form-label"
                >Xác nhận mật khẩu</label
              >
              <input
                type="password"
                class="form-control"
                id="xacnhanmatkhau"
                placeholder="Nhập lại mật khẩu"
                required
              />
              <div class="invalid-feedback">Please provide a valid zip.</div>
            </div>

            <!--End row-->

            <!--Start row-->
            <div class="col-12 mb-2">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  value=""
                  id="invalidCheck"
                  required
                />
                <label class="form-check-label" for="invalidCheck">
                  Đồng ý cung cấp thông tin trên và đồng ý với chính sách bảo
                  mật <a class="bel" href="">Xem tại đây</a>
                </label>
                <div class="invalid-feedback">
                  You must agree before submitting.
                </div>
              </div>
            </div>
            <!--End row-->

            <!--Start row-->
            <div class="col-12 mb-2">
              <button type="submit" class="btn">Đăng kí</button>
            </div>
            <!--End row-->

            <!--Start row-->
            <div class="col-12 mb-4">
              Đã có tài khoản?
              <a class="bel" href="dangnhap.html">Đăng nhập ngay!</a>
            </div>
            <!--End row-->
          </form>
        </div>
      </div>
      <!--End Form đăng ký-->
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- Kết nối Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBudkqY2f7ciR6W1w7AITCFM-bPEMB_y-U",
        authDomain: "thalapsy-efddf.firebaseapp.com",
        projectId: "thalapsy-efddf",
        storageBucket: "thalapsy-efddf.firebasestorage.app",
        messagingSenderId: "396029733407",
        appId: "1:396029733407:web:ca02c3dc665fbebaf8032a",
        measurementId: "G-W9Z4KBH4PN",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const form = document.getElementById("formDangKy");

      form.addEventListener("submit", function (e) {
        e.preventDefault();

        const tenTaiKhoan = document.getElementById("tenTaiKhoan").value;
        const hoTen = document.getElementById("hoTen").value;
        const email = document.getElementById("email").value;
        const matKhau = document.getElementById("matKhau").value;
        const xacNhanMatKhau = document.getElementById("xacnhanmatkhau").value;

        if (matKhau !== xacNhanMatKhau) {
          document.getElementById("xacnhanmatkhau").classList.add("is-invalid");
          form.classList.add("was-validated");
          return;
        }

        if (!form.checkValidity()) {
          form.classList.add("was-validated");
          return;
        }

        createUserWithEmailAndPassword(auth, email, matKhau)
          .then((userCredential) => {
            return updateProfile(userCredential.user, {
              displayName: hoTen + " | " + tenTaiKhoan,
            });
          })
          .then(() => {
            // Không cần alert hay quay lại trang đăng nhập nữa
            // Firebase đã tự đăng nhập cho người dùng, vào thẳng taikhoan.html
            window.location.href = "taikhoan.html";
          })
          .catch((error) => {
            let thongBao = "Đã có lỗi xảy ra, vui lòng thử lại.";
            if (error.code === "auth/email-already-in-use") {
              thongBao = "Email này đã được đăng ký. Bạn thử đăng nhập xem?";
            } else if (error.code === "auth/invalid-email") {
              thongBao = "Email không hợp lệ.";
            } else if (error.code === "auth/weak-password") {
              thongBao = "Mật khẩu cần ít nhất 6 ký tự.";
            }
            alert(thongBao);
          });
      });
    </script>
  </body>
</html>
