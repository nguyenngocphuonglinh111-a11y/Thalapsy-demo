<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>thalapsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        height: 100vh; /*luôn luôn fit được cái máy của ng dùng*/
        justify-content: center; /*canh ngang*/
        align-items: center;
      }
      .wrapper-center {
        justify-content: center;
        display: flex;
        align-items: center;
        height: 100vh;
      }
      .login-container {
        width: 90%;
        max-width: 600px;
        padding: 80px;
        border-radius: 20px;
        background: #0707077a;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        text-align: center;
        color: white;
      }
      .button-group {
        white-space: nowrap; /* không bao h xuống dòng*/
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 20px;
        align-items: center;
      }

      .style-button:hover {
        background: #556266; /*sáng lên khi nhấp chuột*/
        transform: translateY(-2px); /*nhảy lên nhẹ*/
      }
      @media (min-width: 992px) {
        .style-button {
          width: 67%;
          padding: 20px;
          border: none;
          border-radius: 30px;
          background: #9ca8ad;
          font-size: 1rem;
          font-weight: 400;
          cursor: pointer; /*nhấn chuột vào hiện hình bàn tay*/
          transition: 0.1s;
          justify-content: center;
          align-items: center;
          text-decoration: none;
          color: #ffffff;
          font-weight: bold;
          font-size: 1vw;
        }
      }
      @media (max-width: 992px) {
        .style-button {
          width: 67%;
          padding: 20px;
          border: none;
          border-radius: 30px;
          background: #9ca8ad;
          font-size: 1rem;
          font-weight: 400;
          cursor: pointer; /*nhấn chuột vào hiện hình bàn tay*/
          transition: 0.1s;
          justify-content: center;
          align-items: center;
          text-decoration: none;
          text-decoration: none;
          color: #ffffff;
          font-weight: bold;
          font-size: 3vw;
        }
      }
      .btn,
      .buton {
        background-color: #667d8a;
        border-color: #667d8a;
        color: #ffffff;
      }

      .taikhoan {
        background-color: #0707077a;
        width: 100%;
        padding: 20px 50px;
        border-radius: 20px;
        border: 2px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: white;
        margin-top: 50px;
      }
    </style>
  </head>
  <body>
    <!-- Start Navigation-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img
            src="/docs/5.3/assets/brand/bootstrap-logo.svg"
            alt="Logo"
            width="30"
            height="30"
            class="d-inline-block align-text-top"
          />
          <span fw-boild>thalapsy</span>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="trangchu.html"
                >Trang chủ</a
              >
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="gioithieu.html"
                >Giới thiệu</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="vietthu.html"
                >Viết thư</a
              >
            </li>

            <li class="nav-item">
              <a
                class="nav-link active"
                aria-current="page"
                href="taikhoan.html"
                >Tài khoản</a
              >
            </li>

            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#"
                >Liên hệ</a
              >
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Tìm kiếm"
              aria-label="Search"
            />
            <button class="btn btn-outline" type="submit">🔍</button>
          </form>
        </div>
      </div>
    </nav>
    <!-- End Nayvigation-->

    <!--Chưa đăng nhập-->
    <div class="wrapper-center" id="chuaDangNhap" style="display: none">
      <div class="login-container">
        <div class="button-group">
          <img src="" alt="" width="300px" />
          <a href="dangnhap.html" class="style-button">Đăng Nhập</a>

          <a href="dangky.html" class="style-button">Đăng Ký</a>
        </div>
      </div>
    </div>
    <!--Chưa đăng nhập-->

    <!--Đã đăng nhập-->
    <div class="container" id="daDangNhap" style="display: none">
      <div class="row">
        <div class="col-md-10">
          <div class="taikhoan">
            <h4 class="text-center mb-4">THÔNG TIN CÁ NHÂN</h4>
            <div class="row">
              <div class="col-md-4 text-center mb-3 mb-md-0">
                <img
                  src=""
                  alt="Ảnh đại diện"
                  id="anhDaiDien"
                  style="
                    width: 150px;
                    height: 150px;
                    object-fit: cover;
                    border-radius: 12px;
                    background: #ccc;
                  "
                />
              </div>
              <!-- Cột phải: thông tin -->
              <div class="col-md-8">
                <small>Tên người dùng:</small>
                <h5 id="hoTen">...</h5>
                <small>Tên tài khoản:</small>
                <h5 id="tenTaiKhoan">...</h5>
                <small>Email:</small>
                <h5 id="emailNguoiDung" style="opacity: 0.8"></h5>
              </div>
              <div class="button-group">
                <button class="style-button" id="nutDangXuat">Đăng xuất</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--Đã đăng nhập-->

    <!-- Kết nối Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBudkqY2f7ciR6W1w7AITCFM-bPEMB_y-U",
        authDomain: "thalapsy-efddf.firebaseapp.com",
        projectId: "thalapsy-efddf",
        storageBucket: "thalapsy-efddf.firebasestorage.app",
        messagingSenderId: "396029733407",
        appId: "1:396029733407:web:ca02c3dc665fbebaf8032a",
        measurementId: "G-W9Z4KBH4PN",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const boxChuaDangNhap = document.getElementById("chuaDangNhap");
      const boxDaDangNhap = document.getElementById("daDangNhap");

      onAuthStateChanged(auth, (user) => {
        if (user) {
          // Đã đăng nhập -> hiện thông tin, ẩn nút đăng nhập/đăng ký
          const fullName = user.displayName || "";
          const parts = fullName.split(" | ");

          // Gán họ tên và tên tài khoản tương ứng vào các thẻ HTML
          document.getElementById("hoTen").textContent =
            parts[0] || "Chưa cập nhật";
          document.getElementById("tenTaiKhoan").textContent =
            parts[1] || "Chưa cập nhật";
          document.getElementById("emailNguoiDung").textContent = user.email;

          boxDaDangNhap.style.display = "flex";
          boxChuaDangNhap.style.display = "none";
        } else {
          // Chưa đăng nhập -> hiện nút đăng nhập/đăng ký
          boxChuaDangNhap.style.display = "flex";
          boxDaDangNhap.style.display = "none";
        }
      });

      // Xử lý bấm nút Đăng xuất
      document.getElementById("nutDangXuat").addEventListener("click", () => {
        signOut(auth);
      });
    </script>
  </body>
</html>
