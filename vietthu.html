    <style>
      body {
        height: 100vh; /*luôn luôn fit được cái máy của ng dùng*/
        justify-content: center; /*canh ngang*/
        align-items: center;
      }
      .wrapper-center {
        justify-content: center;
        display: flex;
        align-items: center;
        height: 100vh;
      }
      .button-group {
        white-space: nowrap; /* không bao h xuống dòng*/
        display: flex;
        flex-direction: column;
        gap: 30px;
        margin-top: 20px;
      }
      .style-button1 {
        padding: 30px 70px;
        border: none;
        border-radius: 30px;
        background: #586971;
        font-weight: 400;
        cursor: pointer; /*nhấn chuột vào hiện hình bàn tay*/
        transition: 0.1s;
        text-decoration: none;
        color: white;
        font-size: 20px;
        text-align: center;
      }
      .style-button2 {
        padding: 30px 70px;
        border: none;
        border-radius: 30px;
        background: #3b3b3b;
        font-size: 1rem;
        font-weight: 400;
        cursor: pointer; /*nhấn chuột vào hiện hình bàn tay*/
        transition: 0.1s;
        text-decoration: none;
        color: white;
        font-size: 20px;
        text-align: center;
      }
      .style-button3 {
        padding: 30px 70px;
        border: none;
        border-radius: 30px;
        background: #9babb2;
        font-weight: 400;
        cursor: pointer; /*nhấn chuột vào hiện hình bàn tay*/
        transition: 0.1s;
        text-decoration: none;
        color: white;
        font-size: 20px;
        text-align: center;
      }
      .style-button1:hover {
        background: rgba(255, 255, 255, 0.624); /*sáng lên khi nhấp chuột*/
        transform: translateY(-2px); /*nhảy lên nhẹ*/
      }
      .style-button2:hover {
        background: rgba(255, 255, 255, 0.624); /*sáng lên khi nhấp chuột*/
        transform: translateY(-2px); /*nhảy lên nhẹ*/
      }
      .style-button3:hover {
        background: rgba(255, 255, 255, 0.624); /*sáng lên khi nhấp chuột*/
        transform: translateY(-2px); /*nhảy lên nhẹ*/
      }
      .scr {
        display: none;
        opacity: 0;
        transition: opacity 0.7s ease;
      }
      .scr.on {
        display: flex;
        animation: fadeIn 1.2s ease forwards;
      }
      @keyframes fadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .docthu-card {
        width: 90%;
        max-width: 700px;
        background: #0d0d0d99;
        border-radius: 16px;
        backdrop-filter: blur(6px);
        color: #eee;
        padding: 40px;
        text-align: center;
        position: relative;
      }
      .docthu-card h4 {
        font-family: Georgia, serif;
        margin-bottom: 30px;
      }
      .chude-grid {
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
        gap: 15px;
        justify-content: center;
      }
      .chude-btn {
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        background: transparent;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
      }
      .chude-btn:hover {
        background: #6f8288;
      }
      .thu-close {
        color: #fff;
        font-size: 28px;
        text-decoration: none;
        line-height: 1;
      }
      .doc-thu-overlay {
        position: fixed;
        inset: 0;
        background: transparent;
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 100;
      }
      .doc-thu-box {
        background: #0d0d0dee;
        color: #eee;
        border-radius: 16px;
        padding: 35px;
        width: 90%;
        max-width: 600px;
        max-height: 80vh;
        overflow-y: auto;
        position: relative;
      }
      .doc-thu-tieude {
        font-family: Georgia, serif;
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 5px;
      }
      .doc-thu-ngay {
        opacity: 0.6;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .doc-thu-noidung {
        font-style: italic;
        line-height: 1.7;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!-- Start Navigation-->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">

        <button

        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">

            <li class="nav-item">

              <a class="nav-link active" aria-current="page" href="vietthu.html"

    </nav>
    <!-- End Nayvigation-->

    <!--Container-->
    <div class="wrapper-center scr on" id="manChon">
      <div class="login-container">
        <div class="button-group">
          <a class="style-button1" href="#" id="nutVietThu">Viết một lá thư</a>
          <a class="style-button2" href="#" id="nutThuCuaToi">Thư của tôi</a>
          <a class="style-button3" href="" id="nutDocThu">Đọc một lá thư</a>
        </div>
      </div>
    </div>
    <!-- Màn hình: chọn chủ đề để đọc -->
    <div class="wrapper-center scr" id="manDocThu">
      <div class="docthu-card">
        <a
          href="#"
          class="thu-close nut-quay-lai"
          style="position: absolute; top: 15px; right: 20px"
          >&times;</a
        >
        <h4>Bạn muốn đọc về chủ đề gì?</h4>
        <div class="chude-grid">
          <button class="chude-btn" data-chude="">Ngẫu nhiên</button>
          <button class="chude-btn" data-chude="Gia đình">Gia đình</button>
          <button class="chude-btn" data-chude="Bạn bè">Bạn bè</button>
          <button class="chude-btn" data-chude="Tình yêu">Tình yêu</button>
          <button class="chude-btn" data-chude="Học tập">Học tập</button>
          <button class="chude-btn" data-chude="Công việc">Bản thân</button>
          <button class="chude-btn" data-chude="Khác">Khác</button>
        </div>
      </div>
    </div>

    <!-- Modal hiện lá thư ngẫu nhiên tìm được -->
    <div class="doc-thu-overlay" id="docThuOverlay">
      <div class="doc-thu-box">
        <a
          href="#"
          class="thu-close"
          id="dongDocThu"
          style="position: static; float: right"
          >&times;</a
        >
        <div class="doc-thu-tieude" id="docThuTieuDe"></div>
        <div class="doc-thu-ngay" id="docThuNgay"></div>
        <div class="doc-thu-noidung" id="docThuNoiDung"></div>
      </div>
    </div>
    <!--Container-->
    <!-- Kết nối Firebase -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
      import {
        getFirestore,
        collection,
        query,
        where,
        orderBy,
        limit,
        getDocs,
      } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
      const firebaseConfig = {
        apiKey: "AIzaSyBudkqY2f7ciR6W1w7AITCFM-bPEMB_y-U",
        authDomain: "thalapsy-efddf.firebaseapp.com",
        projectId: "thalapsy-efddf",
        storageBucket: "thalapsy-efddf.firebasestorage.app",
        messagingSenderId: "396029733407",
        appId: "1:396029733407:web:ca02c3dc665fbebaf8032a",
        measurementId: "G-W9Z4KBH4PN",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      let daDangNhap = false;
      // === Hàm chuyển màn hình crossfade (cùng 1 trang) ===
      function go(id) {
        const current = document.querySelector(".scr.on");
        const next = document.getElementById(id);
        if (!next || current === next) return;

        if (current) {
          current.style.opacity = "0";
          setTimeout(() => {
            current.classList.remove("on");
            current.style.opacity = "";
            next.style.opacity = "0";
            void next.offsetWidth;
            next.classList.add("on");
            void next.offsetWidth;
            next.style.opacity = "";
          }, 700);
        } else {
          next.classList.add("on");
        }
      }

      onAuthStateChanged(auth, (user) => {
        daDangNhap = !!user;
      });

      // Hàm dùng chung: chặn nếu chưa đăng nhập, cho đi tiếp nếu đã đăng nhập
      function chanNeuChuaDangNhap(e, trangDich) {
        e.preventDefault();

        if (daDangNhap) {
          window.location.href = trangDich;
        } else {
          const dongY = confirm(
            "Mỗi lá thư cần một người gửi, tạo tài khoản để lưu lại hành trình của bạn.\nBấm OK để tạo tài khoản.",
          );
          if (dongY) {
            window.location.href = "dangky.html";
          }
        }
      }

      // Gắn cho nút "Viết một lá thư"
      document
        .getElementById("nutVietThu")
        .addEventListener("click", function (e) {
          chanNeuChuaDangNhap(e, "lathu.html");
        });

      // Gắn cho nút "Thư của tôi"
      document
        .getElementById("nutThuCuaToi")
        .addEventListener("click", function (e) {
          chanNeuChuaDangNhap(e, "thucuatoi.html");
        });
      // Nút "Đọc một lá thư" -> mở màn chọn chủ đề
      document
        .getElementById("nutDocThu")
        .addEventListener("click", function (e) {
          e.preventDefault();
          go("manDocThu");
        });

      // Bấm chọn 1 chủ đề -> bốc ngẫu nhiên 1 thư ẩn danh cùng chủ đề
      document.querySelectorAll(".chude-btn").forEach(function (btn) {
        btn.addEventListener("click", async function () {
          try {
            const chuDe = btn.dataset.chude;
            const thu = await layThuNgauNhien(chuDe);

            if (!thu) {
              alert(
                "Chưa có lá thư nào thuộc chủ đề này cả. Hãy quay lại sau nhé.",
              );
              return;
            }

            const ngay = thu.ngayTao ? thu.ngayTao.toDate() : new Date();
            const p = (n) => String(n).padStart(2, "0");
            document.getElementById("docThuTieuDe").textContent =
              thu.tieuDe || "Không tiêu đề";
            document.getElementById("docThuNgay").textContent =
              p(ngay.getDate()) +
              "/" +
              p(ngay.getMonth() + 1) +
              "/" +
              ngay.getFullYear();
            document.getElementById("docThuNoiDung").textContent = thu.noiDung;
            document.getElementById("manDocThu").style.display = "none";
            document.getElementById("docThuOverlay").style.display = "flex";
          } catch (loi) {
            // In lỗi thật ra để biết chính xác vì sao thất bại
            alert("Có lỗi xảy ra:\n" + loi.message);
            console.error(loi);
          }
        });
      });

      document
        .getElementById("dongDocThu")
        .addEventListener("click", function (e) {
          e.preventDefault();
          document.getElementById("docThuOverlay").style.display = "none";
          document.getElementById("manDocThu").style.display = "";
        });

      async function layThuNgauNhien(chuDe) {
        const soNgauNhien = Math.random();
        const thuCollection = collection(db, "thuAnDanh");

        // Xây điều kiện lọc: nếu có chuDe thì thêm where, không thì bỏ qua
        const dieuKienLoc = chuDe ? [where("chuDe", "==", chuDe)] : [];

        let q = query(
          thuCollection,
          ...dieuKienLoc,
          orderBy("randomKey"),
          where("randomKey", ">=", soNgauNhien),
          limit(1),
        );
        let ketQua = await getDocs(q);

        if (ketQua.empty) {
          q = query(
            thuCollection,
            ...dieuKienLoc,
            orderBy("randomKey"),
            limit(1),
          );
          ketQua = await getDocs(q);
        }

        if (ketQua.empty) return null;
        return ketQua.docs[0].data();
      }
      // Nút X trong màn "Đọc một lá thư" -> quay về màn chọn
      document.querySelectorAll(".nut-quay-lai").forEach(function (nut) {
        nut.addEventListener("click", function (e) {
          e.preventDefault();
          go("manChon");
        });
      });
    </script>
  </body>
</html>
