<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>thalapsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="thu.css" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="preconnect" href="https://www.gstatic.com" />
    <style>
      .wrapper-center {
        justify-content: center;
        display: flex;
        align-items: center;
        height: 100vh;
      }
      .thu-card {
        width: 90%;
        max-width: 900px;
        height: 80vh;
        background: #0d0d0d99;
        border-radius: 16px;
        backdrop-filter: blur(6px);
        color: #eee;
        padding: 30px;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .thu-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
      }
      .thu-avatar {
        width: 45px;
        height: 45px;
        border-radius: 16px;
        background: #ccc;
        flex-shrink: 0;
      }
      .thu-close {
        margin-left: auto;
        color: #fff;
        font-size: 28px;
        text-decoration: none;
        line-height: 1;
      }
      .thu-textarea {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        resize: none;
        color: #ddd;
        font-size: 18px;
        font-style: italic;
        font-family: Georgia, serif;
      }
      .thu-textarea::placeholder {
        color: rgba(255, 255, 255, 0.4);
      }
      .thu-gui-btn {
        align-self: flex-end;
        background: none;
        border: none;
        color: #fff;
        font-size: 26px;
        cursor: pointer;
      }
      .thu-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
      }
      .thu-modal-box {
        background: #b8b6b6c5;
        border-radius: 16px;
        padding: 40px;
        width: 90%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        text-align: right;
      }
      .style-button {
        padding: 15px;
        border: none;
        border-radius: 15px;
        background: #556266;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
      }
      .thu-tieude {
        background: transparent;
        border: none;
        outline: none;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        font-family: Georgia, serif;
        margin-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        padding-bottom: 10px;
      }
      .thu-tieude::placeholder {
        color: rgba(255, 255, 255, 0.4);
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <body>
      <div class="wrapper-center">
        <div class="thu-card">
          <div class="thu-header">
            <div class="thu-avatar"></div>
            <div>
              <h5 class="mb-0" id="tenNguoiVietThu">...</h5>
              <small id="ngayVietThu" style="opacity: 0.7"></small>
            </div>
            <a href="vietthu.html" class="thu-close">&times;</a>
          </div>
          <input
            type="text"
            id="tieuDeThu"
            class="thu-tieude"
            placeholder="Tiêu đề"
          />
          <select
            id="chuDeThu"
            class="thu-tieude"
            style="
              border-bottom: 1px solid rgba(255, 255, 255, 0.15);
              padding-bottom: 10px;
              margin-bottom: 12px;
            "
          >
            <option value="" disabled selected>Chọn chủ đề</option>
            <option value="Gia đình">Gia đình</option>
            <option value="Bạn bè">Bạn bè</option>
            <option value="Tình yêu">Tình yêu</option>
            <option value="Học tập">Học tập</option>
            <option value="Công việc">Bản thân</option>
            <option value="Khác">Khác</option>
          </select>
          <textarea
            id="noiDungThu"
            class="thu-textarea"
            placeholder="Ngày hôm nay của bạn có ổn không?"
          ></textarea>
          <button id="nutGuiThu" class="thu-gui-btn">➤</button>
        </div>
      </div>

      <!-- Modal chọn kiểu gửi -->
      <div id="modalChonGui" class="thu-modal-overlay" style="display: none">
        <div class="thu-modal-box">
          <a href="#" id="dongModal" class="thu-close" style="position: static"
            >&times;</a
          >
          <button class="style-button" id="nutGuiChoMinh">
            Gửi thư cho chính tôi
          </button>
          <button class="style-button" id="nutGuiAnDanh">
            Gửi thư ẩn danh
          </button>
        </div>
      </div>

      <!-- Kết nối Firebase -->
      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import {
          getAuth,
          onAuthStateChanged,
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
        import {
          getFirestore,
          collection,
          addDoc,
          serverTimestamp,
        } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBudkqY2f7ciR6W1w7AITCFM-bPEMB_y-U",
          authDomain: "thalapsy-efddf.firebaseapp.com",
          projectId: "thalapsy-efddf",
          storageBucket: "thalapsy-efddf.firebasestorage.app",
          messagingSenderId: "396029733407",
          appId: "1:396029733407:web:ca02c3dc665fbebaf8032a",
          measurementId: "G-W9Z4KBH4PN",
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Nếu lỡ vào thẳng trang này mà chưa đăng nhập -> đá về vietthu.html
        onAuthStateChanged(auth, (user) => {
          if (!user) {
            window.location.href = "vietthu.html";
            return;
          }
          const parts = (user.displayName || "").split(" | ");
          document.getElementById("tenNguoiVietThu").textContent =
            parts[1] || parts[0] || "Bạn";
        });

        const homNay = new Date();
        document.getElementById("ngayVietThu").textContent =
          homNay.getDate() +
          " Tháng " +
          (homNay.getMonth() + 1) +
          ", " +
          homNay.getFullYear();

        document
          .getElementById("nutGuiThu")
          .addEventListener("click", function () {
            const noiDung = document.getElementById("noiDungThu").value.trim();
            const chuDe = document.getElementById("chuDeThu").value;
            if (!noiDung) {
              alert("Bạn chưa viết gì cả.");
              return;
            }
            if (!chuDe) {
              alert("Bạn hãy chọn một chủ đề cho lá thư.");
              return;
            }
            document.getElementById("modalChonGui").style.display = "flex";
          });

        document
          .getElementById("dongModal")
          .addEventListener("click", function (e) {
            e.preventDefault();
            document.getElementById("modalChonGui").style.display = "none";
          });

        // Gửi cho chính mình -> chỉ lưu 1 bản riêng tư
        document
          .getElementById("nutGuiChoMinh")
          .addEventListener("click", async function () {
            const tieuDe =
              document.getElementById("tieuDeThu").value.trim() ||
              "Không tiêu đề";
            const chuDe = document.getElementById("chuDeThu").value;
            const noiDung = document.getElementById("noiDungThu").value.trim();
            const user = auth.currentUser;
            if (!user) return;

            await addDoc(collection(db, "nguoiDung", user.uid, "thuCuaToi"), {
              tieuDe: tieuDe,
              chuDe: chuDe,
              noiDung: noiDung,
              ngayTao: serverTimestamp(),
              loai: "rieng",
            });

            hoanTatGui();
          });

        // Gửi ẩn danh -> lưu 2 bản: 1 công khai (không tên), 1 riêng tư (để tự xem lại)
        document
          .getElementById("nutGuiAnDanh")
          .addEventListener("click", async function () {
            const tieuDe =
              document.getElementById("tieuDeThu").value.trim() ||
              "Không tiêu đề";
            const chuDe = document.getElementById("chuDeThu").value;
            const noiDung = document.getElementById("noiDungThu").value.trim();
            const user = auth.currentUser;
            if (!user) return;

            await addDoc(collection(db, "thuAnDanh"), {
              tieuDe: tieuDe,
              chuDe: chuDe,
              noiDung: noiDung,
              ngayTao: serverTimestamp(),
              randomKey: Math.random(),
            });

            await addDoc(collection(db, "nguoiDung", user.uid, "thuCuaToi"), {
              tieuDe: tieuDe,
              chuDe: chuDe,
              noiDung: noiDung,
              ngayTao: serverTimestamp(),
              loai: "an_danh",
            });

            hoanTatGui();
          });

        function hoanTatGui() {
          document.getElementById("modalChonGui").style.display = "none";
          alert("Lá thư của bạn đã được gửi đi.");
          window.location.href = "vietthu.html";
        }
      </script>
    </body>
  </body>
</html>
